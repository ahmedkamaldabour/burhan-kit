name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The Ubuntu runners are pinned (not ubuntu-latest) so an image migration cannot change them
        # silently. Node: the supported lines (engines: >=22). macOS runs once, on the newest Node, to
        # keep its queue short, with Homebrew's current jq.
        # The hooks must run on every supported jq (doctor: JQ_MIN = 1.6), not only on a current one:
        # each Ubuntu image ships a fixed jq, checked below so an image update cannot change it silently.
        # `jq` is a case pattern for `jq --version`: Ubuntu 24.04's 1.7.1 package prints "jq-1.7".
        os: [ubuntu-24.04]
        node: [22, 24]
        jq: ['jq-1.7|jq-1.7.1']
        include:
          - { os: ubuntu-22.04, node: 22, jq: 'jq-1.6' }
          - { os: macos-latest, node: 24, jq: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The hooks need bash >= 4, jq, and timeout (pre-commit check). macOS ships bash 3.2 and no
      # timeout: Homebrew's bash goes first on PATH; coreutils provides gtimeout (BSD tools stay default).
      - name: bash 4+, jq and gtimeout (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash jq coreutils
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: jq (Linux)
        if: runner.os == 'Linux'
        run: command -v jq || sudo apt-get install -y jq
      - run: bash --version | head -n 1
      - run: jq --version
      - name: jq version is ${{ matrix.jq }}
        if: matrix.jq != ''
        run: |
          v="$(jq --version)"
          case "$v" in ${{ matrix.jq }}) echo "jq: $v" ;; *) echo "::error::expected ${{ matrix.jq }}, got $v"; exit 1 ;; esac
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: package contents
        run: npm pack --dry-run

  # The Node hooks need neither bash nor jq, so Windows is tested twice: "no-bash" removes bash and jq from
  # PATH (the 0.3 claim, at both ends of `engines`), and a tripwire test fails the job if either is still
  # reachable; "git-bash" keeps Git for Windows, which is what Claude Code uses there and what the pre-commit
  # check prefers (a mirrored tripwire fails that job if Git Bash is gone; it does not run the bash hooks, whose own
  # Windows story is out of scope). Only the Node suite runs here; the bash suites and `npm run lint` stay on Linux and macOS.
  windows:
    name: windows (${{ matrix.variant }}, node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: no-bash, node: 22 }
          - { variant: no-bash, node: 24 }
          - { variant: git-bash, node: 24 }
    env:
      BURHAN_EXPECT_NO_BASH: ${{ matrix.variant == 'no-bash' && '1' || '' }}
      BURHAN_EXPECT_BASH: ${{ matrix.variant == 'git-bash' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: remove bash and jq from PATH (no-bash)
        if: matrix.variant == 'no-bash'
        shell: pwsh
        run: |
          # Drop every PATH directory that holds bash.exe, sh.exe or jq.exe, except System32 (cmd.exe lives
          # there; WSL's bash launcher is ignored by the hooks and by the tripwire).
          $keep = foreach ($d in ($env:PATH -split ';')) {
            if (-not $d) { continue }
            $system = $d -match '\\windows\\system32'
            $hasTool = (Test-Path -LiteralPath (Join-Path $d 'bash.exe')) -or (Test-Path -LiteralPath (Join-Path $d 'sh.exe')) -or (Test-Path -LiteralPath (Join-Path $d 'jq.exe'))
            if ($system -or -not $hasTool) { $d }
          }
          "PATH=$($keep -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: what is on PATH
        shell: pwsh
        run: Get-Command node, git, bash, jq -All -ErrorAction SilentlyContinue | Format-Table Name, Source -AutoSize
      - run: npm ci
      - run: npm run build
      - run: npm run test:node
